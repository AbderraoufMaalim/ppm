# ============================================
# PushPlayManager V2 — Docker Compose PRODUCTION
# Stratégie Hybride : Local + Cloudflare Tunnel
# 
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ============================================

services:
  # ─── MySQL 8.0 ─────────────────────────────
  db:
    image: mysql:8.0
    container_name: ppm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # ⚠️ PAS de "ports:" exposés — MySQL est accessible
    # uniquement depuis le réseau Docker interne
    volumes:
      - ./db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ppm-network

  # ─── Next.js (Production Standalone) ───────
  web:
    build: ./web-app
    container_name: ppm-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ppm-network

  # ─── Cloudflare Tunnel (Accès Distant) ─────
  # Décommentez ce service une fois le tunnel configuré
  # sur https://dash.cloudflare.com
  #
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ppm-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - ppm-network

networks:
  ppm-network:
    driver: bridge
